{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    <title>Amazon Web Scraping</title>
    <style>

        body {
            background-color: #232f3e;
        }

        input, input:focus, button:focus {
            outline: none !important;
            box-shadow: none !important;
            border: none !important;
            padding: 10px !important;
        }

        input {
            border: none !important;
        }

        button.dropdown-toggle, button.dropdown-toggle:focus, button.dropdown-toggle:hover, button.dropdown-toggle:active {
            background-color: #e6e6e6 !important;
            color: #666666 !important;
            border: none !important;
        }

        button.search, button.search:focus, button.search:hover, button.search:active{
            background-color: #febd69 !important;
            color: #353434 !important;
            border: none !important;
            padding: 10px 15px !important;
        }
    
        button.search i {
            font-size: 20px !important;
        }

        .container {
            margin-top: 50px;
            padding: 50px 30px;
            background-color: #131921;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .dropdown-item {
            cursor: pointer;
        }

        .status {
            color: white;
            display: none;
        }

        img.logo {
            width: 230px;
            margin-bottom: 25px;
        }

        #download {
            color: white;
            text-decoration: none;
            display: none;
            gap: 8px;
            align-items: center;
        }

        #code {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        
        
    </style>
</head>
<body>
    
    <div class="container">
        <img class="logo" src="{% static 'images/logo.png' %}" alt="Mi Logo">
        <form class="input-group">
            <button id="format" class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">File format</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item">CSV</a></li>
              <li><a class="dropdown-item">JSON</a></li>
              <li><a class="dropdown-item">XML</a></li>
            </ul>
            <input id="search" type="text" class="form-control" aria-label="Text input with dropdown button" placeholder="Scrap Amazon">
            <button class="btn btn-outline-secondary search" type="button"><i class="fa fa-search send"></i></button>
        </form>
        <div class="d-flex align-items-center mt-4" style="gap: 10px;">
            <div class="spinner-border text-light status" role="status"></div>
            <span id="status-text" class="status">Scraping 'asd' products...</span>
        </div>
        <a id="download" href="">
            <svg style="transform: scale(1.15);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-arrow-down-fill" viewBox="0 0 16 16">
                <path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1m-1 4v3.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 0 1 .708-.708L7.5 11.293V7.5a.5.5 0 0 1 1 0"/>
              </svg>
            <span>Download scraped data</span>
        </a>

        <pre><code class="language-json" id="code"></code></pre>
        
    </div>


    <script>

        $(document).ready(function() {

            var acceptedFlesFormats = ['CSV', 'JSON', 'XML'];

            $('.dropdown-item').on('click', (event) => {
                var format = event.target.innerText;
                $('#format').text(format);
            })

            $('.send').on('click', (event) => {
                
                if (!acceptedFlesFormats.includes($('#format').text())) {
                    return;
                }

                $('.status').css({'display': 'block'});
                $('#download').css({'display': 'none'});
                $('#code').css({'display': 'none'});
                $('#status-text').text(`Scraping '${$('#search').val()}' products...`);

                $.ajax({
                    url: "{% url 'send_scraping' %}",
                    type: 'GET',
                    data: { search: $('#search').val(), 
                            format: $('#format').text().toLowerCase()}, 
                    success: function(response) {
                        $('.status').css({'display': 'none'});
                        $('#download').attr({'href': `/media/scraping/${response.file_name}`,
                                             'download': response.file_name});
                        $('#download').css({'display': 'flex'});
                        
                        $('#code').css({'display': 'block'});
                        if ($('#format').text() == 'JSON') {
                            const formattedJson = JSON.stringify(response.file_content, null, 2);
                            $('#code').text(formattedJson);
                        } else {
                            $('#code').text(response.file_content);
                        }
                    },
                });
            })

        });

    </script>
</body>
</html>
